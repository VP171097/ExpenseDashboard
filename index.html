<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<meta name="color-scheme" content="light dark">
<script>/* apply the saved theme before first paint so there is no flash */try{var t=localStorage.getItem("tally.theme")||"light";if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;if(localStorage.getItem("tally.effects")==="reduced")document.documentElement.dataset.effects="reduced"}catch(e){}</script>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:grid;place-items:center;font:600 15px system-ui;opacity:.6">Loading your money…</div></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
